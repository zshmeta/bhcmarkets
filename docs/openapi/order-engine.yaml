openapi: 3.0.3
info:
  title: BHC Markets - Order Engine API
  version: 0.1.0
  description: |
    REST API for the order-engine service (matching + order book + trades).

    Tip: Import this file into Hoppscotch (Collections → Import → OpenAPI).
servers:
  - url: http://localhost:4000
    description: Local dev (default)
  - url: http://{host}:{port}
    description: Custom host/port
    variables:
      host:
        default: localhost
      port:
        default: '4000'

tags:
  - name: Health
  - name: Orders
  - name: OrderBook
  - name: Trades

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /stats:
    get:
      tags: [Health]
      summary: Service statistics
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '503':
          description: Service not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    post:
      tags: [Orders]
      summary: Place new order
      description: |
        Places an order. DB connectivity is required; returns 503 when DB is down.

        Account identity can be provided either by `X-Account-ID` header or `accountId` in the body.
      parameters:
        - $ref: '#/components/parameters/XAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
            examples:
              limit:
                value:
                  symbol: BTC-USD
                  side: buy
                  type: limit
                  quantity: 0.1
                  price: 50000
      responses:
        '201':
          description: Order accepted (or executed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
        '503':
          description: Database not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Orders]
      summary: List orders (by account)
      parameters:
        - $ref: '#/components/parameters/XAccountId'
        - name: accountId
          in: query
          required: false
          schema:
            type: string
          description: If `X-Account-ID` is not provided, you can pass `accountId` as a query param.
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated statuses (e.g. open,partially_filled)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
        '400':
          description: Missing accountId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Orders]
      summary: Cancel order
      description: DB connectivity is required; returns 503 when DB is down.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/XAccountIdRequired'
      responses:
        '200':
          description: Cancel result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          description: Cancel failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '503':
          description: Database not connected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orderbook/{symbol}:
    get:
      tags: [OrderBook]
      summary: Get order book snapshot
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          example: BTC-USD
        - name: depth
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookSnapshot'
        '503':
          description: Service not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orderbook/{symbol}/depth:
    get:
      tags: [OrderBook]
      summary: Get order book depth
      description: Returns bids/asks as arrays of [price, quantity].
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
          example: BTC-USD
        - name: levels
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Depth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderBookDepthResponse'
        '503':
          description: Service not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trades/{symbol}:
    get:
      tags: [Trades]
      summary: Get recent trades
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Trades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTradesResponse'

  /trades/account/{accountId}:
    get:
      tags: [Trades]
      summary: Get trades for an account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Trades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTradesResponse'

components:
  parameters:
    XAccountId:
      name: X-Account-ID
      in: header
      required: false
      schema:
        type: string
      description: Account identifier for order operations.
    XAccountIdRequired:
      name: X-Account-ID
      in: header
      required: true
      schema:
        type: string
      description: Account identifier for cancel operations.

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      required: [status, timestamp, service]
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: integer
          format: int64
        service:
          type: string
          example: order-engine

    StatsResponse:
      type: object
      description: Order manager stats (shape may evolve).
      additionalProperties: true

    PlaceOrderRequest:
      type: object
      required: [symbol, side, type, quantity]
      properties:
        symbol:
          type: string
          example: BTC-USD
        side:
          type: string
          enum: [buy, sell]
        type:
          type: string
          enum: [market, limit, stop, stop_limit]
        quantity:
          type: number
        price:
          type: number
          nullable: true
        stopPrice:
          type: number
          nullable: true
        timeInForce:
          type: string
          enum: [GTC, IOC, FOK, GTD]
        accountId:
          type: string
          description: Optional if provided via header.
        userId:
          type: string
          description: Optional; may be required depending on environment.

    PlaceOrderResponse:
      type: object
      additionalProperties: true
      description: Result from OrderManager.placeOrder().

    CancelOrderResponse:
      type: object
      additionalProperties: true
      description: Result from OrderManager.cancelOrder().

    Order:
      type: object
      additionalProperties: true

    OrderBookLevel:
      type: object
      required: [price, quantity, orderCount]
      properties:
        price:
          type: string
          example: '50000'
        quantity:
          type: string
          example: '1.5'
        orderCount:
          type: integer

    OrderBookSnapshot:
      type: object
      required: [symbol, bids, asks, lastUpdateId, timestamp]
      properties:
        symbol:
          type: string
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        lastUpdateId:
          type: integer
        timestamp:
          type: integer
          format: int64

    OrderBookDepthResponse:
      type: object
      required: [symbol, bids, asks, timestamp]
      properties:
        symbol:
          type: string
        bids:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - type: string
                - type: number
          example:
            - [50000, 1.2]
            - [49900, 0.8]
        asks:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - type: string
                - type: number
          example:
            - [50100, 0.5]
            - [50200, 1.1]
        timestamp:
          type: integer
          format: int64

    Trade:
      type: object
      additionalProperties: true

    ListOrdersResponse:
      type: object
      required: [orders, total]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total:
          type: integer

    ListTradesResponse:
      type: object
      required: [trades, total]
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        total:
          type: integer
